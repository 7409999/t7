<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no"><title>R</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,sans-serif;background:#1a1a2e;color:#eee;min-height:100vh;padding:16px}h1{text-align:center;font-size:20px;margin-bottom:4px}.sub{text-align:center;font-size:11px;color:#666;margin-bottom:16px}.sb{background:#16213e;border-radius:12px;padding:14px;margin-bottom:12px;font-size:14px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}.d0{background:#e74c3c}.d1{background:#f39c12;animation:p 1s infinite}.d2{background:#2ecc71}@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:10px;color:#fff}.btn:active{transform:scale(.97)}.bc{background:linear-gradient(135deg,#667eea,#764ba2)}.bd{background:#e74c3c}.panel{background:#16213e;border-radius:12px;padding:16px;margin-bottom:12px;display:none}.panel.on{display:block}.sl{width:100%;height:40px;-webkit-appearance:none;background:transparent;margin:8px 0}.sl::-webkit-slider-runnable-track{height:6px;background:#0f3460;border-radius:3px}.sl::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;background:#764ba2;border-radius:50%;margin-top:-13px}.val{text-align:center;font-size:48px;font-weight:700;margin:8px 0;font-variant-numeric:tabular-nums}.pct{text-align:center;font-size:13px;color:#888;margin-bottom:4px}.stop{display:block;width:100%;padding:16px;border:none;border-radius:12px;font-size:20px;font-weight:700;cursor:pointer;color:#fff;background:#e74c3c;margin-top:12px}.stop:active{transform:scale(.97)}.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.pre{padding:10px 0;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;background:#0f3460;flex:1;min-width:60px;text-align:center}.pre:active{background:#1a5276}.la{background:#0d1b2a;border-radius:10px;padding:8px;margin-top:12px;font-size:9px;color:#666;max-height:120px;overflow-y:auto;font-family:monospace;line-height:1.3}.la .k{color:#2ecc71}.la .e{color:#e74c3c}.la .i{color:#f39c12}</style></head><body><h1>R</h1><p class=sub>v5</p><div class=sb><span class="dot d0" id=dt></span><span id=st>ready</span></div><button class="btn bc" id=bc onclick=go()>connect</button><button class="btn bd" id=bx onclick=dc() style=display:none>disconnect</button><div class=panel id=cp><div class=pct><span id=pv>0</span>%</div><div class=val id=vv>0</div><input type=range min=0 max=100 value=0 class=sl id=sl oninput=sv(this.value)><div class=presets><button class=pre onclick=sv(0)>OFF</button><button class=pre onclick=sv(10)>10%</button><button class=pre onclick=sv(25)>25%</button><button class=pre onclick=sv(50)>50%</button><button class=pre onclick=sv(75)>75%</button><button class=pre onclick=sv(100)>MAX</button></div><button class=stop onclick=sv(0)>STOP</button></div><div class=la id=la></div><script>var D,S,CH,MX=100;function L(m,c){var e=document.getElementById('la');e.innerHTML+='<div class='+(c||'k')+'>'+m+'</div>';e.scrollTop=9e9}function ss(t,s){document.getElementById('st').textContent=t;document.getElementById('dt').className='dot d'+s}async function go(){try{ss('scan...','1');L('scanning...','i');D=await navigator.bluetooth.requestDevice({acceptAllDevices:!0,optionalServices:[]});ss('link...','1');D.addEventListener('gattserverdisconnected',function(){ss('off','0');L('disconnected','e');document.getElementById('bc').style.display='block';document.getElementById('bx').style.display='none';document.getElementById('cp').classList.remove('on');CH=null});var g=await D.gatt.connect();L('connected '+D.name,'k');ss('finding ch...','1');var svcs=await g.getPrimaryServices();for(var i=0;i<svcs.length;i++){try{var chs=await svcs[i].getCharacteristics();for(var j=0;j<chs.length;j++){var c=chs[j],u=c.uuid;if(u.indexOf('6001')!==-1&&(c.properties.write||c.properties.writeWithoutResponse)){CH=c;L('found 6001','k');break}}if(CH)break}catch(e){}}if(!CH){L('6001 not found, trying all writable...','i');for(var i=0;i<svcs.length;i++){try{var chs=await svcs[i].getCharacteristics();for(var j=0;j<chs.length;j++){var c=chs[j];if(c.properties.write||c.properties.writeWithoutResponse){CH=c;L('using '+c.uuid.substring(0,8),'i');break}}if(CH)break}catch(e){}}}if(CH){ss('ready','2');document.getElementById('bc').style.display='none';document.getElementById('bx').style.display='block';document.getElementById('cp').classList.add('on');L('ready','k')}else{L('no writable ch','e');ss('fail','0')}}catch(e){L(e.message,'e');ss('fail','0')}}async function sv(v){v=parseInt(v);if(v>MX)v=MX;document.getElementById('sl').value=v;document.getElementById('vv').textContent=v;document.getElementById('pv').textContent=Math.round(v/MX*100);if(!CH)return;try{var d=new Uint8Array([v]);if(CH.properties.writeWithoutResponse)await CH.writeValueWithoutResponse(d);else await CH.writeValueWithResponse(d);L('set '+v+' ('+Math.round(v/MX*100)+'%)','k')}catch(e){L('err:'+e.message,'e')}}function dc(){if(D&&D.gatt.connected)D.gatt.disconnect();document.getElementById('bc').style.display='block';document.getElementById('bx').style.display='none';document.getElementById('cp').classList.remove('on');CH=null;ss('off','0')}</script></body></html>
